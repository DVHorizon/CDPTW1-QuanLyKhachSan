version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hotel_mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: hotel_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hotel_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    volumes:
      - ./db/phpmyadmin-config.php:/etc/phpmyadmin/config.user.inc.php
    depends_on:
      - mysql
    links:
      - mysql

  backend:
    build: ./backend
    container_name: hotel_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=hotel_management
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-grand_horizon_secret_key_2026_luxury_hotel}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - AI_PROVIDER_MODE=${AI_PROVIDER_MODE:-real}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_MODEL=${AI_MODEL:-gemini-3.1-flash-lite}
    command: sh -c "node src/seeders/bootstrapDb.js && npm run dev"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: hotel_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_PROXY_TARGET=http://backend:5000
    depends_on:
      - backend

volumes:
  mysql_data:
