version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hotel_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "rootpassword"
      MYSQL_DATABASE: hotel_management
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hotel_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./db/phpmyadmin-config.php:/etc/phpmyadmin/config.user.inc.php
    depends_on:
      - mysql

  backend:
    build: ./backend
    container_name: hotel_backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=hotel_management
      - PORT=5000
    depends_on:
      - mysql

  frontend:
    build: ./frontend
    container_name: hotel_frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
